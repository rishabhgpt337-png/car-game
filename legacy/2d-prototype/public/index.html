<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Circuit</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <section id="lobby" class="panel">
      <h1>NEON CIRCUIT</h1>
      <p class="tagline">4-player-codes · top-down race combat</p>

      <label for="name">Call sign</label>
      <input id="name" maxlength="14" placeholder="Racer" autocomplete="off" />

      <button id="create" class="primary">Create game</button>

      <div class="divider"><span>or join with a code</span></div>

      <div class="join-row">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off" />
        <button id="join">Join</button>
      </div>

      <p id="lobby-msg" class="msg"></p>
      <p class="hint">WASD / arrows to drive · mouse to aim · click or space to fire</p>
    </section>

    <section id="room" class="panel hidden">
      <h2>Game code</h2>
      <div id="room-code">----</div>
      <ul id="room-players"></ul>
      <button id="start" class="primary hidden">Start race</button>
      <button id="leave" class="ghost">Leave room</button>
      <p id="room-msg" class="msg"></p>
    </section>

    <section id="hud" class="hidden">
      <div class="hud-left">
        <div id="hp-bar"><span></span></div>
        <div id="score">SCORE 0</div>
      </div>
      <div class="hud-right">
        <div id="net">-- ms</div>
        <div id="room-tag"></div>
      </div>
      <div id="killfeed"></div>
      <div id="dead" class="hidden">RESPAWNING</div>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/client.js"></script>
  </body>
</html>
